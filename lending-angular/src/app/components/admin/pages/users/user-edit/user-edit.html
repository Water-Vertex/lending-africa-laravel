<!-- src/app/components/admin/pages/users/user-edit/user-edit.html -->
<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit User</h1>
      <p class="text-gray-600 mt-1">Update user details</p>
    </div>
    <a routerLink="/admin/users"
      class="px-4 py-2 text-white rounded-md hover:bg-[#005C59] transition-colors flex items-center space-x-2 text-sm font-medium"
      style="background-color: #007B77;">
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#007B77] mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading User...</p>
</div>

<div *ngIf="!isLoading" class="space-y-6">
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form (ngSubmit)="onSubmit()" #userForm="ngForm" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- First Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            First Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            name="first_name"
            [(ngModel)]="form.first_name"
            #firstNameInput="ngModel"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="(firstNameInput.invalid && (firstNameInput.dirty || firstNameInput.touched)) || errors['first_name']"
          >
          <p *ngIf="errors['first_name']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['first_name'][0] }}</span>
          </p>
        </div>

        <!-- Last Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Last Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            name="last_name"
            [(ngModel)]="form.last_name"
            #lastNameInput="ngModel"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="(lastNameInput.invalid && (lastNameInput.dirty || lastNameInput.touched)) || errors['last_name']"
          >
          <p *ngIf="errors['last_name']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['last_name'][0] }}</span>
          </p>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            name="email"
            [(ngModel)]="form.email"
            #emailInput="ngModel"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="(emailInput.invalid && (emailInput.dirty || emailInput.touched)) || errors['email']"
          >
          <p *ngIf="errors['email']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['email'][0] }}</span>
          </p>
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
          <input
            type="text"
            name="phone"
            [(ngModel)]="form.phone"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['phone']"
          >
          <p *ngIf="errors['phone']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['phone'][0] }}</span>
          </p>
        </div>

        <!-- Role -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Role <span class="text-red-500">*</span>
          </label>
          <select
            name="role_id"
            [(ngModel)]="form.role_id"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['role_id']"
          >
            <option [ngValue]="null" disabled>{{ isLoadingRoles ? 'Loading roles...' : 'Select a role' }}</option>
            <option *ngFor="let role of roles" [ngValue]="role.id">{{ role.name }}</option>
          </select>
          <p *ngIf="errors['role_id']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['role_id'][0] }}</span>
          </p>
        </div>

        <!-- Status -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Status <span class="text-red-500">*</span>
          </label>
          <select
            name="status"
            [(ngModel)]="form.status"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
          >
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <!-- Password (optional on edit) -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Password <span class="text-gray-400 text-xs">(leave blank to keep unchanged)</span>
          </label>
          <input
            type="password"
            name="password"
            [(ngModel)]="form.password"
            minlength="6"
            placeholder="Minimum 6 characters"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['password']"
          >
          <p *ngIf="errors['password']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['password'][0] }}</span>
          </p>
        </div>

      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
        <button type="button"
          (click)="cancel()"
          class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2">
          <i class="fas fa-times"></i>
          <span>Cancel</span>
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting || userForm.invalid"
          class="px-4 py-2 text-white rounded-md hover:bg-[#005C59] transition-colors flex items-center space-x-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
          style="background-color: #007B77;"
        >
          <span *ngIf="!isSubmitting" class="flex items-center space-x-2">
            <i class="fas fa-save"></i>
            <span>Update User</span>
          </span>
          <span *ngIf="isSubmitting" class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Updating...</span>
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
