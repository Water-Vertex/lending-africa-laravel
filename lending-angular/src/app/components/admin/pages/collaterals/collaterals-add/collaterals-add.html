<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Add New Collateral</h1>
      <p class="text-gray-600 mt-1">Register a new collateral asset</p>
    </div>
    <a routerLink="/admin/collaterals"
      class="px-4 py-2 text-white rounded-md hover:bg-[#005C59] transition-colors flex items-center space-x-2 text-sm font-medium"
      style="background-color: #007B77;">
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>
</div>

<div class="space-y-6">
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form (ngSubmit)="onSubmit()" #collateralForm="ngForm" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Application ID -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Application ID <span class="text-red-500">*</span>
          </label>
          <input
            type="number"
            name="application_id"
            [(ngModel)]="form.application_id"
            required
            placeholder="e.g. 101"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['application_id']"
          >
          <p *ngIf="errors['application_id']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['application_id'][0] }}</span>
          </p>
        </div>

        <!-- Collateral Type (dropdown) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Collateral Type <span class="text-red-500">*</span>
          </label>
          <select
            name="collateral_type_id"
            [(ngModel)]="form.collateral_type_id"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['collateral_type_id']"
          >
            <option [ngValue]="null" disabled>{{ isLoadingTypes ? 'Loading types...' : 'Select a type' }}</option>
            <option *ngFor="let type of types" [ngValue]="type.id">{{ type.name }}</option>
          </select>
          <p *ngIf="errors['collateral_type_id']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['collateral_type_id'][0] }}</span>
          </p>
        </div>

        <!-- Asset Name -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Asset Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            name="asset_name"
            [(ngModel)]="form.asset_name"
            required
            placeholder="e.g. Toyota Corolla 2020"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['asset_name']"
          >
          <p *ngIf="errors['asset_name']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['asset_name'][0] }}</span>
          </p>
        </div>

        <!-- Estimated Value -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Estimated Value</label>
          <input
            type="number"
            step="0.01"
            name="estimated_value"
            [(ngModel)]="form.estimated_value"
            placeholder="e.g. 1500000"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['estimated_value']"
          >
          <p *ngIf="errors['estimated_value']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['estimated_value'][0] }}</span>
          </p>
        </div>

        <!-- Ownership Document No -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Ownership Document No</label>
          <input
            type="text"
            name="ownership_document_no"
            [(ngModel)]="form.ownership_document_no"
            placeholder="e.g. DOC-2024-0012"
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
            [class.border-red-300]="errors['ownership_document_no']"
          >
          <p *ngIf="errors['ownership_document_no']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>{{ errors['ownership_document_no'][0] }}</span>
          </p>
        </div>

        <!-- Verification Status -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Verification Status <span class="text-red-500">*</span>
          </label>
          <select
            name="verification_status"
            [(ngModel)]="form.verification_status"
            required
            class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
          >
            <option value="pending">Pending</option>
            <option value="verified">Verified</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

      </div>

      <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
        <a routerLink="/admin/collaterals"
          class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2">
          <i class="fas fa-times"></i>
          <span>Cancel</span>
        </a>
        <button type="submit" [disabled]="isSubmitting"
          class="px-4 py-2 text-white rounded-md hover:bg-[#005C59] transition-colors flex items-center space-x-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
          style="background-color: #007B77;">
          <span *ngIf="!isSubmitting" class="flex items-center space-x-2">
            <i class="fas fa-save"></i>
            <span>Create Collateral</span>
          </span>
          <span *ngIf="isSubmitting" class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Creating...</span>
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
