<!-- src/app/components/admin/pages/roles/role-edit/role-edit.html -->
<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Edit Role</h1>
      <p class="text-gray-600 mt-1">Update role details</p>
    </div>
    <a routerLink="/admin/roles"
      class="px-4 py-2 text-white rounded-md hover:bg-[#005C59] transition-colors flex items-center space-x-2 text-sm font-medium"
      style="background-color: #007B77;">
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#007B77] mx-auto"></div>
  <p class="text-gray-500 mt-2">Loading Role...</p>
</div>

<div *ngIf="!isLoading" class="space-y-6">
  <div class="bg-white rounded-lg border border-gray-200 p-6">
    <form (ngSubmit)="onSubmit()" #roleForm="ngForm" class="space-y-6">

      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Role Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          name="name"
          [(ngModel)]="form.name"
          #nameInput="ngModel"
          required
          minlength="3"
          maxlength="255"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
          [class.border-red-300]="(nameInput.invalid && (nameInput.dirty || nameInput.touched)) || errors['name']"
        >
        <div *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)" class="mt-2 text-xs text-red-600 space-y-1">
          <div *ngIf="nameInput.errors?.['required']" class="flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>Role name is required</span>
          </div>
          <div *ngIf="nameInput.errors?.['minlength']" class="flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>Minimum 3 characters required</span>
          </div>
          <div *ngIf="nameInput.errors?.['maxlength']" class="flex items-center space-x-1">
            <i class="fas fa-exclamation-circle text-xs"></i>
            <span>Maximum 255 characters allowed</span>
          </div>
        </div>
        <p *ngIf="errors['name']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
          <i class="fas fa-exclamation-circle text-xs"></i>
          <span>{{ errors['name'][0] }}</span>
        </p>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea
          name="description"
          [(ngModel)]="form.description"
          rows="4"
          class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#007B77] focus:border-[#007B77]"
          [class.border-red-300]="errors['description']"
        ></textarea>
        <p *ngIf="errors['description']" class="mt-2 text-xs text-red-600 flex items-center space-x-1">
          <i class="fas fa-exclamation-circle text-xs"></i>
          <span>{{ errors['description'][0] }}</span>
        </p>
      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
        <button type="button"
          (click)="cancel()"
          class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center space-x-2">
          <i class="fas fa-times"></i>
          <span>Cancel</span>
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting || roleForm.invalid"
          class="px-4 py-2 text-white rounded-md hover:bg-[#005C59] transition-colors flex items-center space-x-2 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
          style="background-color: #007B77;"
        >
          <span *ngIf="!isSubmitting" class="flex items-center space-x-2">
            <i class="fas fa-save"></i>
            <span>Update Role</span>
          </span>
          <span *ngIf="isSubmitting" class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Updating...</span>
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
